name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.8
      - name: Bootstrap updated lockfile (temporary)
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          echo 'LOCKFILE_BEGIN'
          cat pnpm-lock.yaml
          echo 'LOCKFILE_END'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format candidate (temporary)
        run: |
          pnpm exec biome format --write .
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; import {readFileSync} from "node:fs"; const files=execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).trim().split("\n").filter(p=>p && p!=="pnpm-lock.yaml"); console.log("FORMAT_JSON:"+JSON.stringify(Object.fromEntries(files.map(p=>[p,readFileSync(p,"utf8")]))));'
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
