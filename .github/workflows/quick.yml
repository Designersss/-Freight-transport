name: Quick Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_BUCKET: freight-private
      S3_ACCESS_KEY: ci-storage-key
      S3_SECRET_KEY: ci-storage-secret-local-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.8
      # Temporary regeneration; the drift check below fails until files are committed.
      - name: Generate updated dependency lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI and generated client
        run: pnpm api:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Collect generated file drift for review
        if: ${{ !cancelled() }}
        run: |
          drift=0
          for path in pnpm-lock.yaml packages/client-api/openapi.json packages/client-api/src/generated/api.ts; do
            if ! git diff --quiet -- "$path"; then
              sha256sum "$path"
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const path = process.argv[1];
                const content = readFileSync(path, "utf8");
                for (let offset = 0; offset < content.length; offset += 4000) {
                  console.log("MOVARO_GENERATED", JSON.stringify({ path, offset, content: content.slice(offset, offset + 4000) }));
                }
              ' "$path"
              drift=1
            fi
          done
          exit "$drift"
      - name: Targeted OpenAPI regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @freight/api exec vitest run src/openapi/zod-schema.test.ts src/openapi/auth-paths.test.ts
      # Temporary review checkpoint; remove after collecting the audit results.
      - name: Dependency audit review checkpoint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          status=0
          echo "::group::Workspace vulnerability audit"
          pnpm audit --audit-level=low || status=1
          echo "::endgroup::"
          echo "::group::Isolated compatibility dependency audit"
          if npm --prefix scripts/auth-compat ci --ignore-scripts --no-audit --no-fund; then
            npm --prefix scripts/auth-compat audit --audit-level=moderate || status=1
            echo "::endgroup::"
            echo "::group::License policy"
            pnpm licenses:check || status=1
          else
            status=1
          fi
          echo "::endgroup::"
          exit "$status"
